<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title id="dynamicTitle">Tienda-fg</title>
    <meta name="theme-color" content="#1E64FF">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/store.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <div class="global-loader" id="globalLoader">
        <div class="loader-logo"><div class="loader-spinner"></div></div>
        <div class="loader-text">Tienda-fg</div>
        <div class="loader-subtext">Cargando experiencia premium…</div>
    </div>

    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="logo-container" aria-label="Inicio Tienda-fg">
                <img src="https://i.ibb.co/LDG7Gf2d/fotor-ai-2025020222510.jpg" alt="Logo Tienda-fg" class="logo-img">
                <span class="brand-name" id="headerStoreName">Tienda-fg</span>
            </a>
            <div class="header-right">
                <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </header>

    <nav class="sticky-nav" id="categoryNav" aria-label="Categorías"></nav>

    <main id="main-content">
        <section class="hero" id="heroSection">
            <div class="hero-glow hero-glow-1"></div>
            <div class="hero-glow hero-glow-2"></div>
            <div class="hero-content">
                <span class="hero-eyebrow"><i class="fas fa-bolt"></i> Nueva temporada</span>
                <h1 id="heroTitle">Bienvenido a <span class="hero-highlight">Tienda-fg</span></h1>
                <p id="heroDescription">Encuentra los mejores productos con calma y consciencia.</p>
                <div class="hero-actions">
                    <button class="btn-hero" onclick="document.getElementById('productosSection').scrollIntoView({behavior:'smooth'})">Ver Catálogo <i class="fas fa-arrow-right"></i></button>
                </div>
            </div>
        </section>

        <section id="productosSection">
            <div class="section-head">
                <h2 class="section-title" id="categoryTitle">
                    <span class="section-icon"><i class="fas fa-leaf"></i></span>
                    <span>Todos los Productos</span>
                </h2>
            </div>
            
            <div id="skeletonLoader" class="skeleton-grid">
                <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-title"></div><div class="skeleton-price"></div><div class="skeleton-btn"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-title"></div><div class="skeleton-price"></div><div class="skeleton-btn"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-title"></div><div class="skeleton-price"></div><div class="skeleton-btn"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-title"></div><div class="skeleton-price"></div><div class="skeleton-btn"></div></div></div>
            </div>

            <div id="dynamicContent"></div>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Navegación inferior">
        <button class="bottom-nav-item active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fas fa-home"></i><span>Inicio</span></button>
        <button class="bottom-nav-item" onclick="document.getElementById('productosSection').scrollIntoView({behavior:'smooth'})"><i class="fas fa-compass"></i><span>Explorar</span></button>
        <button class="bottom-nav-item" id="cartBtn"><i class="fas fa-shopping-bag"></i><span>Carrito</span><span class="cart-badge" id="cartCount">0</span></button>
        <button class="bottom-nav-item" id="menuToggleBottom"><i class="fas fa-bars"></i><span>Menú</span></button>
    </nav>

    <div class="overlay" id="overlay"></div>
    <aside class="panel-desplegable" id="sideMenu">
        <div class="panel-header"><h3><i class="fas fa-bars-staggered"></i> Menú</h3><button class="close-panel-btn" id="closeMenu"><i class="fas fa-times"></i></button></div>
        <div class="panel-body"><div id="tiendasList"></div></div>
    </aside>

    <aside class="cart-panel" id="cartPanel">
        <div class="cart-header"><h3><i class="fas fa-shopping-bag"></i> Tu Carrito</h3><button class="close-cart" id="closeCart"><i class="fas fa-times"></i></button></div>
        <div class="cart-items" id="cartItemsContainer"></div>
        <div class="cart-footer" id="cartFooter">
            <div class="cart-total final"><span>Total</span> <span id="cartTotal">0 CUP</span></div>
            <button class="btn-block btn-checkout" onclick="StoreApp.showCheckoutForm()">Continuar</button>
        </div>
    </aside>

    <div class="toast-notification" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg">Producto añadido</span></div>

    <script>
        // LÓGICA EMBEBIDA PARA EVITAR ERRORES DE CARGA
        document.addEventListener('DOMContentLoaded', async () => {
            const loader = document.getElementById('globalLoader');
            const content = document.getElementById('dynamicContent');
            const skeleton = document.getElementById('skeletonLoader');

            try {
                // 1. Obtener tiendas
                const resStores = await fetch('/api/tiendas/info');
                const stores = await resStores.json();
                if (!stores || stores.length === 0) throw new Error("No hay tiendas creadas.");
                
                const currentStore = stores[0].id;

                // 2. Info tienda
                const resStore = await fetch(`/api/tiendas/${currentStore}`);
                const storeInfo = await resStore.json();
                document.getElementById('headerStoreName').innerText = storeInfo.nombre || 'Tienda-fg';
                document.getElementById('heroTitle').innerText = `Bienvenido a ${storeInfo.nombre || 'Tienda-fg'}`;
                if (storeInfo.descripcion) document.getElementById('heroDescription').innerText = storeInfo.descripcion;

                // 3. Productos
                const resProducts = await fetch(`/api/productos?tienda=${currentStore}`);
                const products = await resProducts.json();
                
                if (skeleton) skeleton.style.display = 'none';

                if (!products || products.length === 0) {
                    content.innerHTML = '<div class="empty-products"><h3>No hay productos</h3></div>';
                } else {
                    let html = '<div class="grid-productos">';
                    products.forEach(p => {
                        const disponible = p.disponible === true || p.disponible === 'true';
                        const desc = p.descuento || 0;
                        const precioFinal = p.precio * (1 - desc / 100);
                        const img = p.imagen || 'https://via.placeholder.com/300';
                        html += `
                            <article class="producto-card">
                                <div class="card-img-wrapper">
                                    <img src="${img}" alt="${p.nombre}">
                                    <div class="availability-badge ${disponible ? 'badge-available' : 'badge-soldout'}">${disponible ? 'Disponible' : 'Agotado'}</div>
                                </div>
                                <div class="card-body">
                                    <h3 class="card-title">${p.nombre}</h3>
                                    <div class="price-box">
                                        ${desc > 0 ? `<span class="old-price">$${p.precio}</span>` : ''}
                                        <span class="new-price">$${precioFinal.toFixed(0)} CUP</span>
                                    </div>
                                    <div class="card-footer">
                                        <button class="btn-add" style="width:100%; justify-content:center;">Añadir</button>
                                    </div>
                                </div>
                            </article>
                        `;
                    });
                    html += '</div>';
                    content.innerHTML = html;
                }

                // Ocultar loader SIEMPRE al terminar
                loader.classList.add('hidden');

            } catch (error) {
                console.error(error);
                loader.classList.add('hidden');
                if (skeleton) skeleton.style.display = 'none';
                content.innerHTML = `<div style="text-align:center; padding:40px; color:red;"><h3>Error</h3><p>${error.message}</p></div>`;
            }
        });
    </script>
</body>
</html>
