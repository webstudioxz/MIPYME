<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - Tienda-fg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1E64FF; --bg-body: #F4F7FE; --sidebar-bg: #0F172A; --text-main: #1A2B4C; --text-muted: #6B7A99; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar-bg); height: 100vh; position: fixed; left: 0; top: 0; padding: 24px 16px; display: flex; flex-direction: column; }
        .sidebar-brand { display: flex; align-items: center; gap: 12px; color: white; text-decoration: none; margin-bottom: 32px; }
        .sidebar-brand i { font-size: 1.5rem; color: var(--primary); }
        .sidebar-brand span { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.2rem; }
        .nav-item { padding: 12px 16px; border-radius: 12px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 12px; margin-bottom: 4px; transition: 0.3s; border: none; background: transparent; width: 100%; text-align: left; font-weight: 500; }
        .nav-item:hover, .nav-item.active { background: rgba(30,100,255,0.1); color: white; }
        .nav-item.logout { margin-top: auto; color: #EF4444; }
        
        /* Main */
        .main-content { margin-left: 260px; padding: 30px; }
        .card { border-radius: 16px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card-header { background: transparent; border-bottom: 1px solid #EEF2F7; padding: 20px; font-weight: 700; }
        .table th { background: #F8FAFF; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); }
        
        /* Loader */
        #loader { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .spinner { width: 50px; height: 50px; border: 4px solid #E2E8F0; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p class="mt-3 text-muted">Verificando acceso...</p>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar" style="display:none;">
    <a href="#" class="sidebar-brand">
        <i class="fas fa-store"></i>
        <span>Mi Tienda</span>
    </a>
    <div class="p-3 mb-3 rounded" style="background: rgba(255,255,255,0.05);">
        <small style="color:#64748b; font-weight:600; text-transform:uppercase; font-size:0.7rem;">Mi Negocio</small>
        <div id="nombreTiendaSidebar" class="text-white fw-bold mt-1">Cargando...</div>
    </div>
    <button class="nav-item active" onclick="showSection('products')"><i class="fas fa-box"></i> Productos</button>
    <button class="nav-item" onclick="showSection('orders')"><i class="fas fa-shopping-cart"></i> Pedidos</button>
    <button class="nav-item logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
</div>

<!-- MAIN CONTENT -->
<div class="main-content" id="app" style="display:none;">
    
    <div id="view-products">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0"><i class="fas fa-box text-primary me-2"></i> Mis Productos</h3>
            <button class="btn btn-primary" onclick="abrirModalProducto()"><i class="fas fa-plus me-1"></i> Nuevo Producto</button>
        </div>
        <div class="card p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead><tr><th>Img</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead>
                    <tbody id="productsList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="view-orders" style="display:none;">
        <h3 class="fw-bold mb-4"><i class="fas fa-shopping-cart text-primary me-2"></i> Pedidos Recibidos</h3>
        <div id="ordersList"></div>
    </div>

</div>

<!-- MODAL PRODUCTO -->
<div class="modal fade" id="productoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content" style="border-radius: 16px; border: none;">
            <div class="modal-header"><h5 class="fw-bold m-0">Producto</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="prodId">
                <div class="mb-3"><label class="form-label fw-semibold">Nombre</label><input type="text" id="prodName" class="form-control" required></div>
                <div class="mb-3"><label class="form-label fw-semibold">Descripción</label><textarea id="prodDesc" class="form-control" rows="2"></textarea></div>
                <div class="row">
                    <div class="col-6 mb-3"><label class="form-label fw-semibold">Precio (CUP)</label><input type="number" id="prodPrice" class="form-control" required></div>
                    <div class="col-6 mb-3"><label class="form-label fw-semibold">Descuento (%)</label><input type="number" id="prodDiscount" class="form-control" value="0"></div>
                </div>
                <div class="mb-3"><label class="form-label fw-semibold">Categoría</label><select id="prodCategory" class="form-select"></select></div>
                <div class="mb-3"><label class="form-label fw-semibold">URL Imagen</label><input type="text" id="prodImage" class="form-control" placeholder="https://..."></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary" onclick="guardarProducto()"><i class="fas fa-save me-1"></i> Guardar</button>
            </div>
        </div>
    </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    let supabaseClient;
    let currentUser;
    let myStore = null;
    let myProducts = [];

    async function initSupabase() {
        const res = await fetch('/api/public-config');
        const config = await res.json();
        supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
    }

    async function checkAuth() {
        await initSupabase();
        const { data: { session } } = await supabaseClient.auth.getSession();
        
        // 🚨 BLOQUEO TOTAL: Si no hay sesión, lo expulsamos a la página principal
        if (!session || !session.user) {
            window.location.href = '/';
            return;
        }

        currentUser = session.user;

        try {
            const res = await fetch(`/api/mi-tienda?owner_id=${currentUser.id}`);
            const data = await res.json();

            // 🚨 Si no tiene tienda, al index
            if (!data.success || !data.store) {
                alert('No tienes una tienda asignada.');
                window.location.href = '/';
                return;
            }

            myStore = data.store;
            document.getElementById('nombreTiendaSidebar').innerText = myStore.nombre;
            
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('sidebar').style.display = 'flex';

            await cargarProductos();
        } catch (e) {
            console.error(e);
            window.location.href = '/';
        }
    }

    function showSection(s) {
        document.getElementById('view-products').style.display = s === 'products' ? 'block' : 'none';
        document.getElementById('view-orders').style.display = s === 'orders' ? 'block' : 'none';
        
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        event.target.closest('.nav-item').classList.add('active');

        if (s === 'orders') cargarPedidos();
    }

    async function cargarProductos() {
        const res = await fetch(`/api/mis-productos?tienda=${myStore.id}`);
        myProducts = await res.json();
        const tbody = document.getElementById('productsList');
        
        if (!myProducts.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No hay productos. Agrega uno nuevo.</td></tr>';
            return;
        }

        tbody.innerHTML = myProducts.map(p => `
            <tr>
                <td><img src="${p.imagen || 'https://via.placeholder.com/40'}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;"></td>
                <td class="fw-semibold">${p.nombre}</td>
                <td>$${p.precio}</td>
                <td>${p.disponible ? '<span class="badge bg-success">Disponible</span>' : '<span class="badge bg-danger">Agotado</span>'}</td>
                <td>
                    <button class="btn btn-sm btn-outline-danger" onclick="eliminarProducto(${p.id})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    async function abrirModalProducto() {
        const limite = myStore.max_productos || 10;
        if (myProducts.length >= limite) {
            alert(`Has alcanzado el límite de ${limite} productos de tu plan.`);
            return;
        }

        document.getElementById('prodId').value = '';
        document.getElementById('prodName').value = '';
        document.getElementById('prodDesc').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodDiscount').value = '0';
        document.getElementById('prodImage').value = '';
        
        const cats = myStore.categorias || ['otros'];
        document.getElementById('prodCategory').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');

        new bootstrap.Modal(document.getElementById('productoModal')).show();
    }

    async function guardarProducto() {
        const nombre = document.getElementById('prodName').value;
        const precio = parseFloat(document.getElementById('prodPrice').value);
        
        if (!nombre || !precio) { alert('Nombre y precio son obligatorios'); return; }

        const payload = {
            tienda: myStore.id,
            nombre: nombre,
            descripcion: document.getElementById('prodDesc').value,
            precio: precio,
            descuento: parseInt(document.getElementById('prodDiscount').value) || 0,
            categoria: document.getElementById('prodCategory').value,
            imagen: document.getElementById('prodImage').value || 'https://via.placeholder.com/300',
            disponible: true
        };

        const res = await fetch('/api/mis-productos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            bootstrap.Modal.getInstance(document.getElementById('productoModal')).hide();
            await cargarProductos();
        } else {
            alert('Error al guardar');
        }
    }

    async function eliminarProducto(id) {
        if (!confirm('¿Eliminar este producto?')) return;
        await fetch(`/api/mis-productos/${id}`, { method: 'DELETE' });
        await cargarProductos();
    }

    async function cargarPedidos() {
        const res = await fetch(`/api/mis-pedidos?tienda=${myStore.id}`);
        const orders = await res.json();
        const container = document.getElementById('ordersList');

        if (!orders.length) {
            container.innerHTML = '<div class="alert alert-info">Aún no tienes pedidos.</div>';
            return;
        }

        container.innerHTML = orders.map(o => `
            <div class="card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <h5 class="fw-bold">Pedido #${o.id}</h5>
                        <span class="badge bg-primary">${o.estado}</span>
                    </div>
                    <p class="mb-1"><strong>Cliente:</strong> ${o.nombre} - ${o.telefono}</p>
                    <p class="mb-1"><strong>Dirección:</strong> ${o.direccion}</p>
                    <p class="mb-1"><strong>Total:</strong> $${o.total}</p>
                </div>
            </div>
        `).join('');
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        window.location.href = '/';
    }

    window.addEventListener('load', checkAuth);
</script>
</body>
</html>
