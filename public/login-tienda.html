<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mi Tienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .card { width: 100%; max-width: 400px; border: none; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .card-header { background: #4F46E5; color: white; text-align: center; border-radius: 12px 12px 0 0 !important; padding: 20px; }
        .card-header h4 { margin: 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h4>Acceso a Mi Tienda</h4>
        </div>
        <div class="card-body p-4">
            <div id="errorMsg" class="alert alert-danger d-none"></div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="tu@correo.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="btnLogin">Entrar a mi panel</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 1. Obtener credenciales de Supabase
        fetch('/api/public-config')
            .then(res => res.json())
            .then(config => {
                if (!config.supabaseUrl || !config.supabaseAnonKey) {
                    showError("Faltan las credenciales de conexión en el servidor.");
                    return;
                }
                
                const supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

                document.getElementById('loginForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('btnLogin');
                    const errorDiv = document.getElementById('errorMsg');
                    btn.disabled = true;
                    btn.innerHTML = 'Verificando...';
                    errorDiv.classList.add('d-none');

                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;

                    // 2. Iniciar sesión con Supabase
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

                    if (error) {
                        showError("Credenciales incorrectas o cuenta no válida.");
                        btn.disabled = false;
                        btn.innerHTML = 'Entrar a mi panel';
                        return;
                    }

                    // 3. Guardar token y datos básicos
                    localStorage.setItem('tiendaToken', data.session.access_token);
                    // Guardamos un objeto temporal, el panel lo actualizará al cargar
                    localStorage.setItem('tiendaData', JSON.stringify({ email: data.user.email }));

                    // 4. Redirigir al panel
                    window.location.href = '/admin-cliente';
                });

                function showError(msg) {
                    const errorDiv = document.getElementById('errorMsg');
                    errorDiv.textContent = msg;
                    errorDiv.classList.remove('d-none');
                    btn.disabled = false;
                    btn.innerHTML = 'Entrar a mi panel';
                }
            })
            .catch(() => alert("Error de conexión con el servidor."));
    </script>
</body>
</html>
