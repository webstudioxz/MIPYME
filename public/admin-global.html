<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Tienda-fg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #F4F7FE; }
        .sidebar { width: 260px; background: #0F172A; height: 100vh; position: fixed; left: 0; top: 0; padding: 24px 16px; display: flex; flex-direction: column; }
        .sidebar-brand { display: flex; align-items: center; gap: 12px; color: white; text-decoration: none; margin-bottom: 32px; }
        .sidebar-brand i { font-size: 1.5rem; color: #1E64FF; }
        .sidebar-brand span { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.2rem; }
        .nav-item { padding: 12px 16px; border-radius: 12px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 12px; margin-bottom: 4px; transition: 0.3s; text-decoration: none; font-weight: 500; }
        .nav-item:hover, .nav-item.active { background: rgba(30,100,255,0.1); color: white; }
        .main-content { margin-left: 260px; padding: 30px; }
        .card { border-radius: 16px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card-header { background: transparent; border-bottom: 1px solid #EEF2F7; padding: 20px; font-weight: 700; }
        .table th { background: #F8FAFF; font-size: 0.75rem; text-transform: uppercase; color: #6B7A99; }
        .badge-plan { padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.7rem; }
        .badge-prueba { background: #E0F2FE; color: #0369A1; }
        .badge-basico { background: #D1FAE5; color: #065F46; }
        .badge-pro { background: #FEF3C7; color: #92400E; }
    </style>
</head>
<body>

<div class="sidebar">
    <a href="#" class="sidebar-brand">
        <i class="fas fa-crown"></i>
        <span>Super Admin</span>
    </a>
    <a href="#view-tiendas" class="nav-item active" onclick="showSection('tiendas')"><i class="fas fa-store"></i> Tiendas</a>
    <a href="/" class="nav-item" target="_blank"><i class="fas fa-external-link-alt"></i> Ver Tienda</a>
    <button class="nav-item border-0 bg-transparent text-start w-100 mt-auto" style="color:#EF4444;" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Salir</button>
</div>

<div class="main-content">
    <div id="view-tiendas">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0"><i class="fas fa-store text-primary me-2"></i> Tiendas Activas</h3>
            <button class="btn btn-primary" onclick="abrirModalCrearTienda()"><i class="fas fa-plus me-1"></i> Crear Tienda Manual</button>
        </div>
        <div class="card p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Tienda</th>
                            <th>Dueño</th>
                            <th>Plan</th>
                            <th>Vence</th>
                            <th>Productos</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tiendasList"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- MODAL CREAR TIENDA MANUAL -->
<div class="modal fade" id="crearTiendaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content" style="border-radius: 16px; border: none;">
            <div class="modal-header"><h5 class="fw-bold">Crear Tienda Manual</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-3"><label class="form-label fw-semibold">Email del Dueño</label><input type="email" id="manualEmail" class="form-control" placeholder="cliente@gmail.com" required></div>
                <div class="mb-3"><label class="form-label fw-semibold">Nombre de la Tienda</label><input type="text" id="manualNombre" class="form-control" required></div>
                <div class="mb-3"><label class="form-label fw-semibold">Tipo</label><select id="manualTipo" class="form-select"><option value="tienda">Tienda</option><option value="reserva">Reservas</option></select></div>
                <div class="mb-3"><label class="form-label fw-semibold">Plan</label><select id="manualPlan" class="form-select"><option value="prueba">Prueba</option><option value="basico">Básico</option><option value="pro">Pro</option></select></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary" onclick="crearTiendaManual()"><i class="fas fa-save"></i> Crear</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function loadTiendas() {
        try {
            const res = await fetch('/api/superadmin/tiendas');
            const tiendas = await res.json();
            const tbody = document.getElementById('tiendasList');

            if (!tiendas.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No hay tiendas.</td></tr>';
                return;
            }

            tbody.innerHTML = tiendas.map(t => {
                const plan = t.plan || 'prueba';
                const planBadge = plan === 'prueba' ? 'badge-prueba' : plan === 'basico' ? 'badge-basico' : 'badge-pro';
                const vence = t.fecha_vencimiento ? new Date(t.fecha_vencimiento).toLocaleDateString() : 'Sin fecha';
                const vencido = t.fecha_vencimiento && new Date(t.fecha_vencimiento) < new Date();

                return `
                <tr>
                    <td><div class="fw-bold">${t.nombre}</div><small class="text-muted">${t.id}</small></td>
                    <td>${t.owner_email || 'Sin dueño'}</td>
                    <td><span class="badge-plan ${planBadge}">${plan.toUpperCase()}</span></td>
                    <td class="${vencido ? 'text-danger fw-bold' : ''}">${vence} ${vencido ? '⚠️' : ''}</td>
                    <td>${t.productos_count || 0} / ${t.max_productos}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="extenderPrueba('${t.id}')"><i class="fas fa-clock"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="eliminarTienda('${t.id}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
                `;
            }).join('');
        } catch (e) { console.error(e); alert('Error cargando tiendas.'); }
    }

    async function extenderPrueba(id) {
        if (!confirm('¿Extender 30 días?')) return;
        const res = await fetch(`/api/superadmin/extender/${id}`, { method: 'POST' });
        if (res.ok) { alert('✅ Extendida'); loadTiendas(); }
    }

    async function eliminarTienda(id) {
        if (!confirm('¿Eliminar tienda?')) return;
        const res = await fetch(`/api/superadmin/tiendas/${id}`, { method: 'DELETE' });
        if (res.ok) { alert('🗑️ Eliminada'); loadTiendas(); }
    }

    function abrirModalCrearTienda() {
        new bootstrap.Modal(document.getElementById('crearTiendaModal')).show();
    }

    async function crearTiendaManual() {
        const email = document.getElementById('manualEmail').value.trim();
        const nombre = document.getElementById('manualNombre').value.trim();
        const tipo = document.getElementById('manualTipo').value;
        const plan = document.getElementById('manualPlan').value;

        if (!email || !nombre) { alert('Completa los campos'); return; }

        const res = await fetch('/api/superadmin/crear-tienda', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, nombre_negocio: nombre, tipo, plan })
        });

        const data = await res.json();
        if (data.success) {
            alert('✅ Tienda creada: ' + data.slug);
            bootstrap.Modal.getInstance(document.getElementById('crearTiendaModal')).hide();
            loadTiendas();
        } else {
            alert('Error: ' + data.error);
        }
    }

    function logout() { window.location.href = '/'; }

    window.addEventListener('load', loadTiendas);
</script>
</body>
</html>
