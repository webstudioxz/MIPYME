<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title id="dynamicTitle">Tienda-fg — Calidad y Confianza</title>
    <meta name="theme-color" content="#1E64FF">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/store.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
                if(registrations.length > 0) {
                    window.location.reload(true);
                }
            });
        }
    </script>

    <div class="global-loader" id="globalLoader">
        <div class="loader-logo"><div class="loader-spinner"></div></div>
        <div class="loader-text">Tienda-fg</div>
        <div class="loader-subtext">Cargando experiencia premium…</div>
    </div>

    <div class="product-modal" id="productModal" onclick="if(event.target===this)StoreApp.closeProductModal()">
        <div class="product-modal-content">
            <button class="modal-close" onclick="StoreApp.closeProductModal()" aria-label="Cerrar"><i class="fas fa-times"></i></button>
            <div class="product-modal-body" id="modalBody"></div>
        </div>
    </div>

    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="logo-container" aria-label="Inicio Tienda-fg">
                <img src="https://i.ibb.co/LDG7Gf2d/fotor-ai-2025020222510.jpg" alt="Logo Tienda-fg" class="logo-img">
                <span class="brand-name" id="headerStoreName">Tienda-fg</span>
            </a>
            <div class="header-right">
                <div class="currency-dropdown">
                    <button class="currency-btn" id="currencyBtn" aria-label="Cambiar moneda">
                        <i class="fas fa-coins"></i>
                        <span id="selectedCurrencyText">CUP</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="currency-menu" id="currencyMenu" role="menu">
                        <div class="currency-option active" data-currency="CUP"><i class="fas fa-coins"></i> CUP <small>Peso cubano</small></div>
                        <div class="currency-option" data-currency="USD"><i class="fas fa-dollar-sign"></i> USD <small>Dólar EE.UU.</small></div>
                        <div class="currency-option" data-currency="EUR"><i class="fas fa-euro-sign"></i> EUR <small>Euro</small></div>
                    </div>
                </div>
                <button class="icon-action" id="cartBtnDesktop" aria-label="Ver carrito">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-badge" id="cartCountDesktop">0</span>
                </button>
                <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </header>

    <nav class="sticky-nav" id="categoryNav" aria-label="Categorías"></nav>

    <main id="main-content">
        <section class="hero" id="heroSection">
            <div class="hero-glow hero-glow-1"></div>
            <div class="hero-glow hero-glow-2"></div>
            <div class="hero-content">
                <span class="hero-eyebrow"><i class="fas fa-bolt"></i> Nueva temporada</span>
                <h1 id="heroTitle">Bienvenido a <span class="hero-highlight">Tienda-fg</span></h1>
                <p id="heroDescription">Encuentra los mejores productos con calma y consciencia.</p>
                <div class="hero-actions">
                    <button class="btn-hero" onclick="document.getElementById('productosSection').scrollIntoView({behavior:'smooth'})">Ver Catálogo <i class="fas fa-arrow-right"></i></button>
                </div>
            </div>
        </section>

        <section id="productosSection">
            <div class="section-head">
                <h2 class="section-title" id="categoryTitle">
                    <span class="section-icon"><i class="fas fa-leaf"></i></span>
                    <span>Todos los Productos</span>
                </h2>
            </div>
            
            <div id="skeletonLoader" class="skeleton-grid">
                <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-title"></div><div class="skeleton-price"></div><div class="skeleton-btn"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-title"></div><div class="skeleton-price"></div><div class="skeleton-btn"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-title"></div><div class="skeleton-price"></div><div class="skeleton-btn"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-title"></div><div class="skeleton-price"></div><div class="skeleton-btn"></div></div></div>
            </div>

            <div id="dynamicContent"></div>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Navegación inferior">
        <button class="bottom-nav-item active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fas fa-home"></i><span>Inicio</span></button>
        <button class="bottom-nav-item" onclick="document.getElementById('productosSection').scrollIntoView({behavior:'smooth'})"><i class="fas fa-compass"></i><span>Explorar</span></button>
        <button class="bottom-nav-item" id="cartBtn"><i class="fas fa-shopping-bag"></i><span>Carrito</span><span class="cart-badge" id="cartCount">0</span></button>
        <button class="bottom-nav-item" id="menuToggleBottom"><i class="fas fa-bars"></i><span>Menú</span></button>
    </nav>

    <div class="overlay" id="overlay"></div>
    <aside class="panel-desplegable" id="sideMenu">
        <div class="panel-header"><h3><i class="fas fa-bars-staggered"></i> Menú</h3><button class="close-panel-btn" id="closeMenu"><i class="fas fa-times"></i></button></div>
        <div class="panel-body"><div id="tiendasList"></div></div>
    </aside>

    <aside class="cart-panel" id="cartPanel">
        <div class="cart-header"><h3><i class="fas fa-shopping-bag"></i> Tu Carrito</h3><button class="close-cart" id="closeCart"><i class="fas fa-times"></i></button></div>
        <div class="cart-items" id="cartItemsContainer"></div>
        <div class="cart-footer" id="cartFooter">
            <div class="cart-total final"><span>Total</span> <span id="cartTotal">0 CUP</span></div>
            <button class="btn-block btn-checkout" onclick="StoreApp.showCheckoutForm()">Continuar</button>
        </div>
    </aside>

    <div class="toast-notification" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg">Producto añadido</span></div>

    <script>
        window.StoreAPI = {
            async getConfig() {
                try {
                    const res = await fetch('/api/config?_=' + Date.now());
                    return await res.json();
                } catch (e) {
                    return { tasas: { USD: 0.04, EUR: 0.037 } };
                }
            },
            async getProducts(tienda) {
                try {
                    const res = await fetch(`/api/productos?tienda=${tienda}&_=${Date.now()}`);
                    return await res.json();
                } catch (e) {
                    return [];
                }
            },
            async getStoresInfo() {
                try {
                    const res = await fetch('/api/tiendas/info');
                    return await res.json();
                } catch (e) {
                    return [];
                }
            },
            async getStoreById(id) {
                try {
                    const res = await fetch(`/api/tiendas/${id}`);
                    return await res.json();
                } catch (e) {
                    return null;
                }
            },
            async checkStatus() {
                try {
                    const r = await fetch('/api/status?_=' + Date.now());
                    return r.ok;
                } catch (e) {
                    return false;
                }
            }
        };

        window.StoreUI = {
            currentCurrency: 'CUP',
            formatPrice(priceCUP) {
                return `$${priceCUP.toFixed(0)}`;
            },
            showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                const icon = toast?.querySelector('i');
                const msg = document.getElementById('toastMsg');
                if (!toast || !icon || !msg) return;
                msg.innerText = message;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => toast.classList.remove('show'), 2800);
            },
            renderCategorias(categorias) {
                const nav = document.getElementById('categoryNav');
                if (!nav) return;
                let html = `<a class="cat-link active" data-cat="todos" onclick="StoreApp.filterByCategory('todos')">Todos</a>`;
                categorias.forEach(c => {
                    html += `<a class="cat-link" data-cat="${c}" onclick="StoreApp.filterByCategory('${c}')">${c.charAt(0).toUpperCase() + c.slice(1)}</a>`;
                });
                nav.innerHTML = html;
            },
            renderContent(products, categorias, currentCategory) {
                const container = document.getElementById('dynamicContent');
                const skeleton = document.getElementById('skeletonLoader');
                if (skeleton) skeleton.style.display = 'none';
                if (!container) return;
                
                if (!products || products.length === 0) {
                    container.innerHTML = '<div class="empty-products"><h3>No hay productos</h3></div>';
                    return;
                }
                let filtrados = currentCategory === 'todos' ? products : products.filter(p => (p.categoria || 'otros') === currentCategory);
                if (filtrados.length === 0) {
                    container.innerHTML = '<div class="empty-products"><h3>Categoría vacía</h3></div>';
                    return;
                }
                container.innerHTML = `<div class="grid-productos">${filtrados.map(p => this.renderProductCard(p)).join('')}</div>`;
            },
            renderProductCard(p) {
                const d = p.precio * (1 - (p.descuento || 0) / 100);
                const available = p.disponible === true || p.disponible === 'true';
                const img = Array.isArray(p.imagen) ? p.imagen[0] : p.imagen;
                const imgSrc = img || 'https://via.placeholder.com/300';
                return `
                    <article class="producto-card">
                        <div class="card-img-wrapper" onclick="StoreApp.openProductModal(${p.id})">
                            <img src="${imgSrc}" alt="${p.nombre}" loading="lazy">
                            <div class="availability-badge ${available ? 'badge-available' : 'badge-soldout'}">${available ? 'Disponible' : 'Agotado'}</div>
                        </div>
                        <div class="card-body">
                            <h3 class="card-title">${p.nombre}</h3>
                            <div class="price-box">
                                ${p.descuento ? `<span class="old-price">$${p.precio}</span>` : ''}
                                <span class="new-price">$${d.toFixed(0)}</span>
                            </div>
                            <div class="card-footer">
                                <div class="qty-control">
                                    <button class="qty-btn" onclick="StoreUI.updateCardQty(this,-1)">−</button>
                                    <span class="qty-val">1</span>
                                    <button class="qty-btn" onclick="StoreUI.updateCardQty(this,1)">+</button>
                                </div>
                                <button class="btn-add" onclick="StoreApp.addToCartFromCard(${p.id},this)" ${!available ? 'disabled' : ''}>Añadir</button>
                            </div>
                        </div>
                    </article>
                `;
            },
            updateCardQty(btn, delta) {
                const val = btn.parentElement.querySelector('.qty-val');
                let v = parseInt(val.innerText) + delta;
                if (v >= 1 && v <= 3) val.innerText = v;
            }
        };

        window.StoreApp = {
            currentStore: null,
            allProducts: [],
            categorias: [],
            currentCategory: 'todos',
            async init() {
                document.getElementById('globalLoader').classList.add('hidden');
                try {
                    const stores = await StoreAPI.getStoresInfo();
                    if (stores && stores.length > 0) {
                        this.currentStore = stores[0].id;
                    } else {
                        return this.showEmptyState('No hay tiendas creadas.');
                    }
                    
                    const tiendaInfo = await StoreAPI.getStoreById(this.currentStore);
                    if (tiendaInfo && tiendaInfo.nombre) {
                        document.getElementById('headerStoreName').innerText = tiendaInfo.nombre;
                        document.getElementById('heroTitle').innerText = `Bienvenido a ${tiendaInfo.nombre}`;
                    }

                    const products = await StoreAPI.getProducts(this.currentStore);
                    this.allProducts = Array.isArray(products) ? products : [];
                    
                    if (this.allProducts.length === 0) return this.showEmptyState('No hay productos.');

                    const catSet = new Set(this.allProducts.map(p => p.categoria || 'otros'));
                    this.categorias = Array.from(catSet);
                    StoreUI.renderCategorias(this.categorias);
                    StoreUI.renderContent(this.allProducts, this.categorias, this.currentCategory);
                    
                } catch (e) {
                    this.showEmptyState('Error de conexión.');
                }
            },
            showEmptyState(msg) {
                document.getElementById('skeletonLoader').style.display = 'none';
                document.getElementById('dynamicContent').innerHTML = `<div class="empty-products"><h3>Tienda vacía</h3><p>${msg}</p></div>`;
            },
            filterByCategory(cat) {
                this.currentCategory = cat;
                document.querySelectorAll('.cat-link').forEach(l => l.classList.remove('active'));
                document.querySelector(`.cat-link[data-cat="${cat}"]`)?.classList.add('active');
                StoreUI.renderContent(this.allProducts, this.categorias, cat);
            },
            openProductModal(id) {},
            closeProductModal() {},
            addToCartFromCard(id, btn) {
                StoreUI.showToast('Producto añadido al carrito (demo)');
            }
        };

        document.addEventListener('DOMContentLoaded', () => StoreApp.init());
    </script>
</body>
</html>
