<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Tienda-fg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0F172A, #1E64FF, #0F172A); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: white; }
        .card { background: white; color: #1A2B4C; border-radius: 28px; padding: 48px 40px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.3); }
        .icon { width: 80px; height: 80px; background: #E6F9F0; color: #10B981; border-radius: 50%; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        h1 { font-weight: 800; margin-bottom: 12px; }
        p { color: #6B7A99; line-height: 1.6; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon"><i class="fas fa-check-circle"></i></div>
    <h1>¡Cuenta creada!</h1>
    <p>Tu solicitud está siendo revisada por el administrador.<br><br>En cuanto sea aprobada, recibirás una notificación.</p>
</div>
</body>
</html>
